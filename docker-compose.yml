services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.dev
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env.local
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    networks:
      - app-network

networks:
  app-network:
    driver: bridge